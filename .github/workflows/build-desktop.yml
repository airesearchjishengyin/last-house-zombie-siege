name: Build desktop apps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'electron/**'
      - 'server.py'
      - 'index.html'
      - 'game.js'
      - 'maps.js'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'electron/**'
      - 'server.py'
      - 'index.html'
      - 'game.js'
      - 'maps.js'
      - 'style.css'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            target: mac
            artifact: last-house-macos
          - name: Windows x64
            os: windows-2022
            target: win
            data_separator: ';'
            artifact: last-house-windows-x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Bundle local HTTP service and game files (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onedir --contents-directory . \
            --name last-house-server \
            --add-data "index.html:." \
            --add-data "game.js:." \
            --add-data "maps.js:." \
            --add-data "style.css:." \
            --target-arch "$(node -p process.arch)" \
            server.py
      - name: Bundle local HTTP service and game files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onedir --contents-directory . \
            --name last-house-server \
            --add-data "index.html;." \
            --add-data "game.js;." \
            --add-data "maps.js;." \
            --add-data "style.css;." \
            server.py
      - run: npm ci
      - name: Package app
        run: npm run package:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
